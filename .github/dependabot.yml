# Weekly update PRs for npm packages and GitHub Actions.
# Part of the security checklist (supply chain gate).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Nest CLI needs TypeScript's compiler API, which 7.0 doesn't ship (back in 7.1)
      - dependency-name: typescript
        versions: ["7.0.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
